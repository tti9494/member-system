<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Admin Console</title>
<style>
  :root {
    --bg: #eaf0f7;
    --surface: #ffffff;
    --surface-soft: #f4f7fb;
    --border: #b9c4d4;
    --border-strong: #8595ad;
    --text: #0e1726;
    --muted: #3a485f;
    --subtle: #5a6a82;
    --primary: #18438f;
    --primary-strong: #103174;
    --primary-soft: #e2ecff;
    --green: #0a6a47;
    --green-strong: #084f37;
    --green-soft: #def4e8;
    --amber: #8a4d00;
    --amber-strong: #6b3b00;
    --amber-soft: #fdedca;
    --red: #a8281d;
    --red-strong: #841a12;
    --red-soft: #fde2df;
    --black: #1c2433;
    --black-soft: #e3e7ed;
    --shadow: 0 16px 40px rgba(20, 30, 50, 0.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 18px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select, textarea {
    font: inherit;
  }

  button {
    border: 0;
  }

  .page {
    max-width: 1520px;
    margin: 0 auto;
    padding: 28px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
  }

  .eyebrow {
    color: var(--primary);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  h1 {
    margin: 0;
    font-size: 38px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    font-weight: 850;
  }

  .subtitle {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 17px;
  }

  .top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  .auth-panel {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) auto auto;
    gap: 12px;
    align-items: end;
    padding: 20px;
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    color: var(--muted);
    font-size: 15px;
    font-weight: 750;
    margin-bottom: 8px;
  }

  input, select, textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 10px;
    min-height: 52px;
    padding: 12px 14px;
    font-size: 17px;
    outline: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(24, 67, 143, 0.18);
  }

  textarea {
    resize: vertical;
    min-height: 88px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 50px;
    padding: 12px 16px;
    border-radius: 10px;
    background: #e6ecf4;
    color: var(--text);
    font-size: 16px;
    font-weight: 750;
    cursor: pointer;
    white-space: nowrap;
    border: 1.5px solid transparent;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }

  .btn:hover { background: #dae1ec; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .btn.primary {
    background: var(--primary);
    color: #fff;
  }

  .btn.primary:hover { background: var(--primary-strong); }

  .btn.green {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .btn.green:hover { background: var(--green-strong); border-color: var(--green-strong); }

  .btn.amber {
    background: #fff;
    color: var(--amber-strong);
    border-color: var(--amber);
  }
  .btn.amber:hover { background: var(--amber-soft); }

  .btn.red {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  .btn.red:hover { background: var(--red-strong); border-color: var(--red-strong); }

  .status-line {
    min-height: 26px;
    color: var(--muted);
    font-size: 16px;
    margin: -2px 0 16px;
  }

  .status-line.error { color: var(--red-strong); font-weight: 750; }
  .status-line.ok { color: var(--green-strong); font-weight: 750; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat-card {
    padding: 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .stat-card.accent-pending { border-left: 4px solid var(--amber); }
  .stat-card.accent-approved { border-left: 4px solid var(--green); }
  .stat-card.accent-rejected { border-left: 4px solid var(--amber-strong); }
  .stat-card.accent-blacklist { border-left: 4px solid var(--red); }
  .stat-card.accent-expiring { border-left: 4px solid var(--primary); }

  .stat-label {
    color: var(--muted);
    font-size: 15px;
    font-weight: 750;
    letter-spacing: -0.005em;
  }

  .stat-value {
    font-size: 34px;
    line-height: 1.1;
    margin-top: 8px;
    font-weight: 850;
    color: var(--text);
  }

  .toolbar {
    display: grid;
    grid-template-columns: 1.1fr 180px 180px auto;
    gap: 12px;
    padding: 16px;
    margin-bottom: 18px;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(390px, 480px) minmax(0, 1fr);
    gap: 16px;
    align-items: start;
  }

  .list-panel, .detail-panel {
    min-height: 600px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 20px;
    font-weight: 850;
    letter-spacing: -0.005em;
  }

  .panel-caption {
    color: var(--muted);
    font-size: 15px;
  }

  .member-list {
    padding: 8px;
    max-height: 72vh;
    overflow: auto;
  }

  .member-card {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: 11px;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
  }

  .member-card + .member-card { margin-top: 4px; }

  .member-card:hover {
    background: var(--surface-soft);
    border-color: var(--border);
  }

  .member-card:focus-visible {
    outline: 3px solid var(--primary);
    outline-offset: 1px;
  }

  .member-card.active {
    background: var(--primary-soft);
    border-color: var(--primary);
    box-shadow: 0 2px 8px rgba(24, 67, 143, 0.15);
  }

  .member-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .member-name {
    font-size: 19px;
    font-weight: 850;
    color: var(--text);
    overflow-wrap: anywhere;
    letter-spacing: -0.005em;
  }

  .member-meta {
    margin-top: 8px;
    display: flex;
    gap: 4px 12px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 15px;
  }

  .member-meta span {
    display: inline-flex;
    align-items: center;
  }

  .member-meta span + span::before {
    content: "·";
    margin-right: 12px;
    color: var(--border-strong);
  }

  .pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 800;
    border: 1.5px solid transparent;
    white-space: nowrap;
    letter-spacing: -0.005em;
  }

  .pill.pending { color: #fff; background: var(--amber); border-color: var(--amber-strong); }
  .pill.approved { color: #fff; background: var(--green); border-color: var(--green-strong); }
  .pill.rejected { color: var(--amber-strong); background: var(--amber-soft); border-color: var(--amber); }
  .pill.blacklist { color: #fff; background: var(--black); border-color: var(--black); }
  .pill.neutral { color: var(--muted); background: #eef2f7; border-color: var(--border); }

  .detail-body {
    padding: 22px;
  }

  .detail-empty {
    color: var(--muted);
    padding: 48px 16px;
    text-align: center;
    font-size: 16px;
  }

  .detail-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .detail-name {
    font-size: 30px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -0.01em;
    overflow-wrap: anywhere;
  }

  .detail-id {
    margin-top: 6px;
    color: var(--muted);
    font-size: 15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    overflow-wrap: anywhere;
  }

  .action-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 18px 0 22px;
    padding: 14px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .action-row::before {
    content: "처리 작업";
    width: 100%;
    color: var(--muted);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .result-box {
    display: none;
    margin-bottom: 18px;
    border: 1.5px solid var(--primary);
    background: var(--primary-soft);
    border-radius: 12px;
    padding: 18px;
  }

  .result-box.show { display: block; }
  .result-title {
    color: var(--primary-strong);
    font-size: 17px;
    font-weight: 850;
    margin-bottom: 6px;
  }

  .code-line {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .code-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 0.08em;
    background: #fff;
    border: 1px solid #bdcaff;
    border-radius: 8px;
    padding: 8px 10px;
  }

  .section-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  .info-section {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-soft);
    overflow: hidden;
  }

  .info-section.wide {
    grid-column: 1 / -1;
  }

  .section-heading {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 16px;
    font-weight: 850;
    color: var(--text);
    background: #fff;
    letter-spacing: -0.005em;
  }

  .kv {
    display: grid;
    grid-template-columns: 160px minmax(0, 1fr);
    border-bottom: 1px solid var(--border);
  }

  .kv:last-child { border-bottom: 0; }

  .kv dt, .kv dd {
    margin: 0;
    padding: 12px 16px;
    font-size: 16px;
  }

  .kv dt {
    color: var(--muted);
    font-size: 15px;
    font-weight: 750;
  }

  .kv dd {
    background: #fff;
    color: var(--text);
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }

  .scheduler-list {
    display: grid;
    gap: 8px;
  }

  .scheduler-item {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 14px;
    background: #fff;
    font-size: 15px;
    color: var(--text);
  }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 48px 18px;
    font-size: 16px;
  }

  .hidden { display: none; }

  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(4, minmax(120px, 1fr)); }
    .layout { grid-template-columns: 1fr; }
    .member-list { max-height: none; }
  }

  @media (max-width: 760px) {
    .page { padding: 18px 12px 36px; }
    .topbar { flex-direction: column; }
    .top-actions { justify-content: flex-start; }
    h1 { font-size: 28px; }
    .auth-panel, .toolbar { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .section-grid { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 118px minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main class="page">
  <header class="topbar">
    <div>
      <div class="eyebrow">Member System</div>
      <h1>관리자 콘솔</h1>
      <p class="subtitle">신청자 검토, 상태 처리, 코드 관리, 자동 작업 상태를 한 화면에서 확인합니다.</p>
    </div>
    <div class="top-actions">
      <a class="btn" href="/frontend/join-basic.html" target="_blank" rel="noopener">Basic 신청서</a>
      <a class="btn" href="/frontend/join-full.html" target="_blank" rel="noopener">Full 신청서</a>
    </div>
  </header>

  <section class="panel auth-panel" aria-label="관리자 인증">
    <div class="field">
      <label for="admin-key">Admin API Key</label>
      <input id="admin-key" type="password" autocomplete="off" placeholder="관리자 키를 입력하면 목록을 불러옵니다.">
    </div>
    <button class="btn primary" id="connect-btn" type="button">연결</button>
    <button class="btn" id="clear-key-btn" type="button">키 지우기</button>
  </section>

  <div id="status-line" class="status-line">관리자 키는 이 브라우저 세션에만 저장됩니다.</div>

  <section id="dashboard" class="hidden">
    <section class="stats-grid" aria-label="신청 통계">
      <div class="stat-card"><div class="stat-label">전체</div><div class="stat-value" id="stat-total">-</div></div>
      <div class="stat-card accent-pending"><div class="stat-label">대기</div><div class="stat-value" id="stat-pending">-</div></div>
      <div class="stat-card accent-approved"><div class="stat-label">승인</div><div class="stat-value" id="stat-approved">-</div></div>
      <div class="stat-card accent-rejected"><div class="stat-label">거절</div><div class="stat-value" id="stat-rejected">-</div></div>
      <div class="stat-card accent-blacklist"><div class="stat-label">차단</div><div class="stat-value" id="stat-blacklist">-</div></div>
      <div class="stat-card"><div class="stat-label">Basic</div><div class="stat-value" id="stat-basic">-</div></div>
      <div class="stat-card accent-expiring"><div class="stat-label">7일 내 만료</div><div class="stat-value" id="stat-expiring">-</div></div>
    </section>

    <section class="panel toolbar" aria-label="신청자 필터">
      <div class="field">
        <label for="search-input">검색</label>
        <input id="search-input" type="search" placeholder="이름, 전화번호, 직업, 신청 ID">
      </div>
      <div class="field">
        <label for="status-filter">상태</label>
        <select id="status-filter">
          <option value="">전체</option>
          <option value="pending" selected>대기</option>
          <option value="approved">승인</option>
          <option value="rejected">거절</option>
          <option value="blacklist">차단</option>
        </select>
      </div>
      <div class="field">
        <label for="grade-filter">참여 등급</label>
        <select id="grade-filter">
          <option value="">전체</option>
          <option value="🌱 새싹">새싹</option>
          <option value="🔥 열정">열정</option>
          <option value="⭐ 적극">적극</option>
          <option value="💎 헌신">헌신</option>
          <option value="👑 마스터">마스터</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn primary" id="refresh-btn" type="button">새로고침</button>
      </div>
    </section>

    <section class="layout">
      <section class="panel list-panel" aria-label="신청자 목록">
        <div class="panel-head">
          <div>
            <div class="panel-title">신청자 목록</div>
            <div class="panel-caption" id="list-caption">-</div>
          </div>
          <span class="pill neutral" id="active-filter-label">대기</span>
        </div>
        <div id="member-list" class="member-list"></div>
      </section>

      <section class="panel detail-panel" aria-label="신청자 상세">
        <div class="panel-head">
          <div>
            <div class="panel-title">상세 검토</div>
            <div class="panel-caption">전화번호와 발급 코드는 화면에만 일시 표시되고 저장하지 않습니다.</div>
          </div>
        </div>
        <div id="detail-body" class="detail-body">
          <div class="detail-empty">왼쪽 목록에서 신청자를 선택하세요.</div>
        </div>
      </section>
    </section>
  </section>
</main>

<script>
(() => {
  const state = {
    key: sessionStorage.getItem("memberAdminKey") || "",
    members: [],
    detail: null,
    scheduler: null,
    selectedId: "",
  };

  const $ = (id) => document.getElementById(id);

  const fields = {
    adminKey: $("admin-key"),
    statusLine: $("status-line"),
    dashboard: $("dashboard"),
    memberList: $("member-list"),
    detailBody: $("detail-body"),
    searchInput: $("search-input"),
    statusFilter: $("status-filter"),
    gradeFilter: $("grade-filter"),
    listCaption: $("list-caption"),
    activeFilterLabel: $("active-filter-label"),
  };

  fields.adminKey.value = state.key;

  function setStatus(message, tone = "") {
    fields.statusLine.textContent = message;
    fields.statusLine.className = `status-line ${tone}`.trim();
  }

  function adminHeaders() {
    return {
      "Content-Type": "application/json",
      "X-Admin-Key": state.key,
    };
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: {
        ...adminHeaders(),
        ...(options.headers || {}),
      },
    });
    let data = {};
    try {
      data = await response.json();
    } catch (_) {
      data = {};
    }
    if (!response.ok) {
      const detail = typeof data.detail === "string" ? data.detail : "";
      throw new Error(detail || data.message || `HTTP ${response.status}`);
    }
    return data;
  }

  function formatDate(value) {
    if (!value) return "-";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return String(value);
    return date.toLocaleString("ko-KR", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
    });
  }

  function formatValue(value) {
    if (value === null || value === undefined || value === "") return "-";
    if (value === 1) return "예";
    if (value === 0) return "아니오";
    if (typeof value === "boolean") return value ? "예" : "아니오";
    if (typeof value === "string") {
      const trimmed = value.trim();
      if ((trimmed.startsWith("[") && trimmed.endsWith("]")) || (trimmed.startsWith("{") && trimmed.endsWith("}"))) {
        try {
          const parsed = JSON.parse(trimmed);
          if (Array.isArray(parsed)) return parsed.length ? parsed.join(", ") : "-";
          return JSON.stringify(parsed, null, 2);
        } catch (_) {
          return value;
        }
      }
    }
    return String(value);
  }

  function statusLabel(status) {
    return {
      pending: "대기",
      approved: "승인",
      rejected: "거절",
      blacklist: "차단",
    }[status] || status || "-";
  }

  function statusPill(status) {
    const span = document.createElement("span");
    span.className = `pill ${status || "neutral"}`;
    span.textContent = statusLabel(status);
    return span;
  }

  function updateStats(stats) {
    const data = stats || {};
    $("stat-total").textContent = data.total ?? "-";
    $("stat-pending").textContent = data.pending ?? "-";
    $("stat-approved").textContent = data.approved ?? "-";
    $("stat-rejected").textContent = data.rejected ?? "-";
    $("stat-blacklist").textContent = data.blacklist ?? "-";
    $("stat-basic").textContent = data.basic ?? "-";
    $("stat-expiring").textContent = data.expiring_7d ?? "-";
  }

  function buildQuery() {
    const params = new URLSearchParams();
    if (fields.statusFilter.value) params.set("status", fields.statusFilter.value);
    if (fields.gradeFilter.value) params.set("grade", fields.gradeFilter.value);
    const query = params.toString();
    return query ? `?${query}` : "";
  }

  function filteredMembers() {
    const query = fields.searchInput.value.trim().toLowerCase();
    if (!query) return state.members;
    return state.members.filter((member) => {
      const haystack = [
        member.id,
        member.name,
        member.phone_masked,
        member.job,
        member.plan_type,
        member.ai_level,
        member.participation_grade,
        member.reason,
      ].map((v) => String(v || "").toLowerCase()).join(" ");
      return haystack.includes(query);
    });
  }

  function renderMembers() {
    const members = filteredMembers();
    fields.memberList.innerHTML = "";
    fields.listCaption.textContent = `${members.length}명 표시 / ${state.members.length}명 로드`;
    fields.activeFilterLabel.textContent = fields.statusFilter.value ? statusLabel(fields.statusFilter.value) : "전체";

    if (!members.length) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "조건에 맞는 신청자가 없습니다.";
      fields.memberList.appendChild(empty);
      return;
    }

    for (const member of members) {
      const card = document.createElement("button");
      card.type = "button";
      card.className = `member-card${member.id === state.selectedId ? " active" : ""}`;
      card.addEventListener("click", () => selectMember(member.id));

      const main = document.createElement("div");
      main.className = "member-main";
      const name = document.createElement("div");
      name.className = "member-name";
      name.textContent = member.name || "(이름 없음)";
      main.append(name, statusPill(member.status));

      const meta = document.createElement("div");
      meta.className = "member-meta";
      const metaValues = [
        member.phone_masked || "전화번호 없음",
        member.plan_type || "plan 없음",
        member.participation_grade || "등급 없음",
        formatDate(member.created_at),
      ];
      for (const item of metaValues) {
        const span = document.createElement("span");
        span.textContent = item;
        meta.appendChild(span);
      }

      card.append(main, meta);
      fields.memberList.appendChild(card);
    }
  }

  function fieldRows(items) {
    const fragment = document.createDocumentFragment();
    for (const [label, value, formatter] of items) {
      const row = document.createElement("dl");
      row.className = "kv";
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = formatter ? formatter(value) : formatValue(value);
      row.append(dt, dd);
      fragment.appendChild(row);
    }
    return fragment;
  }

  function infoSection(title, items, wide = false) {
    const section = document.createElement("section");
    section.className = `info-section${wide ? " wide" : ""}`;
    const heading = document.createElement("div");
    heading.className = "section-heading";
    heading.textContent = title;
    section.appendChild(heading);
    section.appendChild(fieldRows(items));
    return section;
  }

  function actionButton(label, className, disabled, handler) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = `btn ${className || ""}`.trim();
    button.disabled = disabled;
    button.textContent = label;
    button.addEventListener("click", handler);
    return button;
  }

  function showActionResult(title, message, code, expiresAt) {
    const box = $("action-result");
    box.innerHTML = "";
    const resultTitle = document.createElement("div");
    resultTitle.className = "result-title";
    resultTitle.textContent = title;
    const resultMessage = document.createElement("div");
    resultMessage.textContent = message;
    box.append(resultTitle, resultMessage);
    if (code) {
      const line = document.createElement("div");
      line.className = "code-line";
      const codeValue = document.createElement("span");
      codeValue.className = "code-value";
      codeValue.textContent = code;
      const copy = actionButton("코드 복사", "primary", false, async () => {
        try {
          await navigator.clipboard.writeText(code);
          setStatus("코드를 클립보드에 복사했습니다.", "ok");
        } catch (_) {
          window.prompt("복사할 코드를 선택하세요.", code);
        }
      });
      line.append(codeValue, copy);
      box.appendChild(line);
    }
    if (expiresAt) {
      const expires = document.createElement("div");
      expires.className = "panel-caption";
      expires.style.marginTop = "8px";
      expires.textContent = `만료 예정: ${formatDate(expiresAt)}`;
      box.appendChild(expires);
    }
    box.classList.add("show");
  }

  function renderScheduler() {
    const section = document.createElement("section");
    section.className = "info-section wide";
    const heading = document.createElement("div");
    heading.className = "section-heading";
    heading.textContent = "자동 작업 상태";
    section.appendChild(heading);

    const wrap = document.createElement("div");
    wrap.className = "scheduler-list";
    wrap.style.padding = "12px";

    if (!state.scheduler) {
      const empty = document.createElement("div");
      empty.className = "panel-caption";
      empty.textContent = "스케줄러 상태를 불러오지 못했습니다.";
      wrap.appendChild(empty);
    } else {
      const running = document.createElement("div");
      running.className = "scheduler-item";
      running.textContent = `상태: ${state.scheduler.running ? "running" : "stopped"}`;
      wrap.appendChild(running);
      for (const job of state.scheduler.jobs || []) {
        const item = document.createElement("div");
        item.className = "scheduler-item";
        item.textContent = `${job.id} - 다음 실행: ${job.next_run || "-"}`;
        wrap.appendChild(item);
      }
    }
    section.appendChild(wrap);
    return section;
  }

  function renderDetail(member) {
    fields.detailBody.innerHTML = "";
    const top = document.createElement("div");
    top.className = "detail-top";

    const titleWrap = document.createElement("div");
    const name = document.createElement("div");
    name.className = "detail-name";
    name.textContent = member.name || "(이름 없음)";
    const id = document.createElement("div");
    id.className = "detail-id";
    id.textContent = member.id || "-";
    titleWrap.append(name, id);
    top.append(titleWrap, statusPill(member.status));

    const result = document.createElement("div");
    result.id = "action-result";
    result.className = "result-box";

    const actions = document.createElement("div");
    actions.className = "action-row";
    actions.append(
      actionButton("승인 및 코드 발급", "green", member.status !== "pending", () => approveMember(member.id)),
      actionButton("거절", "amber", member.status === "blacklist", () => rejectMember(member.id)),
      actionButton("코드 재발급", "primary", member.status !== "approved", () => regenCode(member.id)),
      actionButton("차단", "red", member.status === "blacklist", () => blacklistMember(member.id))
    );

    const grid = document.createElement("div");
    grid.className = "section-grid";
    grid.append(
      infoSection("기본 정보", [
        ["상태", member.status, statusLabel],
        ["전화번호", member.phone_masked],
        ["성별", member.gender],
        ["나이", member.age],
        ["직업/소속", member.job],
        ["유입 경로", member.referral_source],
        ["신청 유형", member.plan_type],
        ["참여 등급", member.participation_grade],
      ]),
      infoSection("AI 활용", [
        ["자가진단 레벨", member.ai_level],
        ["사용 도구", member.ai_tools],
        ["구독 서비스", member.ai_subscription],
        ["주당 사용 시간", member.ai_weekly_hours],
        ["활용 분야", member.ai_use_cases],
        ["모임 목표", member.group_goals],
      ]),
      infoSection("신청 사유와 기여", [
        ["관심 이유", member.reason],
        ["단기 목표", member.short_term_goal],
        ["참여 방식", member.participation_type],
        ["선호 일정", member.preferred_schedule],
        ["지역", member.region],
        ["주 사용 기기", member.main_device],
        ["코딩 가능", member.can_code],
        ["발표 가능", member.can_present],
        ["보유 역량", member.skills],
        ["기여 가능성", member.contribution],
      ], true),
      infoSection("처리 이력", [
        ["신청일", member.created_at, formatDate],
        ["승인일", member.approved_at, formatDate],
        ["거절 사유", member.rejection_reason],
        ["코드 발급일", member.code_issued_at, formatDate],
        ["코드 만료일", member.code_expires_at, formatDate],
        ["코드 실패 횟수", member.code_fail_count],
        ["잠금 해제 예정", member.code_locked_until, formatDate],
      ]),
      infoSection("동의 정보", [
        ["개인정보 동의", member.consent_personal],
        ["마케팅 동의", member.consent_marketing],
        ["동의 시각", member.consent_at, formatDate],
        ["동의 버전", member.consent_version],
      ]),
      renderScheduler()
    );

    fields.detailBody.append(top, actions, result, grid);
  }

  async function selectMember(memberId) {
    state.selectedId = memberId;
    renderMembers();
    fields.detailBody.innerHTML = '<div class="detail-empty">상세 정보를 불러오는 중입니다.</div>';
    try {
      const data = await api(`/members/${encodeURIComponent(memberId)}`);
      state.detail = data.data;
      renderDetail(state.detail);
      setStatus("상세 정보를 불러왔습니다.", "ok");
    } catch (error) {
      setStatus(error.message, "error");
      fields.detailBody.innerHTML = '<div class="detail-empty">상세 정보를 불러오지 못했습니다.</div>';
    }
  }

  async function loadDashboard() {
    if (!state.key) {
      setStatus("관리자 키를 입력해야 신청자 목록을 볼 수 있습니다.", "error");
      return;
    }
    sessionStorage.setItem("memberAdminKey", state.key);
    fields.dashboard.classList.remove("hidden");
    setStatus("데이터를 불러오는 중입니다.");

    try {
      const [stats, members, scheduler] = await Promise.all([
        api("/stats"),
        api(`/members${buildQuery()}`),
        api("/scheduler/status").catch(() => null),
      ]);
      updateStats(stats.data || {});
      state.members = members.data || [];
      state.scheduler = scheduler;
      if (state.selectedId && !state.members.some((member) => member.id === state.selectedId)) {
        state.selectedId = "";
        state.detail = null;
        fields.detailBody.innerHTML = '<div class="detail-empty">왼쪽 목록에서 신청자를 선택하세요.</div>';
      }
      renderMembers();
      setStatus("신청자 목록을 갱신했습니다.", "ok");
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  async function approveMember(memberId) {
    if (!window.confirm("승인하면 코드가 발급되고 알림 전송이 시도됩니다. 계속할까요?")) return;
    try {
      const data = await api(`/approve/${encodeURIComponent(memberId)}`, { method: "POST" });
      await loadDashboard();
      await selectMember(memberId);
      showActionResult("승인 완료", "발급 코드는 이 화면에만 일시 표시됩니다.", data.code, data.expires_at);
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  async function rejectMember(memberId) {
    const reason = window.prompt("거절 사유를 입력하세요.");
    if (!reason || !reason.trim()) return;
    try {
      const data = await api(`/reject/${encodeURIComponent(memberId)}`, {
        method: "POST",
        body: JSON.stringify({ reason: reason.trim() }),
      });
      await loadDashboard();
      await selectMember(memberId);
      showActionResult("거절 처리 완료", data.message || "거절 상태로 변경했습니다.");
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  async function regenCode(memberId) {
    if (!window.confirm("기존 코드를 폐기하고 새 코드를 발급합니다. 계속할까요?")) return;
    try {
      const data = await api(`/regen-code/${encodeURIComponent(memberId)}`, { method: "POST" });
      await loadDashboard();
      await selectMember(memberId);
      showActionResult("코드 재발급 완료", "새 코드는 이 화면에만 일시 표시됩니다.", data.code, data.expires_at);
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  async function blacklistMember(memberId) {
    if (!window.confirm("이 신청자를 차단 상태로 변경합니다. 계속할까요?")) return;
    try {
      const data = await api(`/blacklist/${encodeURIComponent(memberId)}`, { method: "POST" });
      await loadDashboard();
      await selectMember(memberId);
      showActionResult("차단 처리 완료", data.message || "차단 상태로 변경했습니다.");
    } catch (error) {
      setStatus(error.message, "error");
    }
  }

  $("connect-btn").addEventListener("click", () => {
    state.key = fields.adminKey.value.trim();
    loadDashboard();
  });

  $("clear-key-btn").addEventListener("click", () => {
    state.key = "";
    fields.adminKey.value = "";
    sessionStorage.removeItem("memberAdminKey");
    fields.dashboard.classList.add("hidden");
    setStatus("관리자 키를 지웠습니다.", "ok");
  });

  $("refresh-btn").addEventListener("click", loadDashboard);
  fields.statusFilter.addEventListener("change", () => {
    state.selectedId = "";
    loadDashboard();
  });
  fields.gradeFilter.addEventListener("change", () => {
    state.selectedId = "";
    loadDashboard();
  });
  fields.searchInput.addEventListener("input", renderMembers);
  fields.adminKey.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      state.key = fields.adminKey.value.trim();
      loadDashboard();
    }
  });

  if (state.key) {
    loadDashboard();
  }
})();
</script>
</body>
</html>
