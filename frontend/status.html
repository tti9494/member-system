<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSEN 강의 신청·예약 확인</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0d12;
    --panel: #111821;
    --panel-strong: #151f2b;
    --ink: #f1f5f9;
    --muted: #9aa8ba;
    --line: #263445;
    --line-strong: #3a4a5e;
    --primary: #73a7ff;
    --primary-dark: #a8c8ff;
    --green: #3dd68c;
    --amber: #f6c768;
    --red: #ff7b72;
    --chip: #0d131b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding: 28px 14px 64px;
  }
  main { max-width: 980px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    align-items: flex-end;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 4px; font-size: 1.72rem; line-height: 1.2; letter-spacing: 0; }
  h2 { margin-bottom: 12px; font-size: 1.12rem; letter-spacing: 0; }
  h3 { margin-bottom: 8px; font-size: 1rem; letter-spacing: 0; }
  .subtitle { margin-bottom: 0; color: var(--muted); }
  .top-note { color: var(--muted); text-align: right; font-size: 0.92rem; min-width: 170px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 16px 34px rgba(0,0,0,0.24);
  }
  .panel.compact { padding: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .status-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; align-items: start; }
  label { display: block; font-weight: 760; margin-bottom: 6px; color: var(--ink); }
  input, select, textarea {
    width: 100%;
    min-height: 46px;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 11px 12px;
    font: inherit;
    background: var(--chip);
    color: var(--ink);
  }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(115, 167, 255, 0.16);
  }
  .field { margin-bottom: 14px; }
  .hint { color: var(--muted); font-size: 0.9rem; margin-top: 6px; }
  button {
    min-height: 46px;
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 11px 15px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    background: var(--primary);
    color: #07111f;
  }
  button:hover { background: var(--primary-dark); }
  button:disabled { background: #48576a; color: #c9d2df; cursor: not-allowed; }
  .secondary {
    background: var(--chip);
    color: var(--ink);
    border-color: var(--line-strong);
  }
  .secondary:hover { background: var(--panel-strong); }
  .notice {
    border-radius: 7px;
    padding: 11px 13px;
    margin-bottom: 14px;
    color: var(--muted);
    background: var(--chip);
    border: 1px solid var(--line);
  }
  .notice.ok { color: var(--green); border-color: rgba(61, 214, 140, 0.45); font-weight: 760; }
  .notice.error { color: var(--red); border-color: rgba(255, 123, 114, 0.5); font-weight: 760; }
  .hidden { display: none; }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .metric {
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 12px;
    background: var(--chip);
  }
  .metric-label { color: var(--muted); font-size: 0.84rem; }
  .metric-value { font-size: 1rem; font-weight: 850; margin-top: 3px; overflow-wrap: anywhere; }
  .list { display: grid; gap: 12px; }
  .empty-state {
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 18px;
    background: var(--chip);
    color: var(--muted);
  }
  .booking-card {
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 16px;
    background: var(--chip);
  }
  .booking-card.confirmed {
    border-color: rgba(61, 214, 140, 0.82);
    background: linear-gradient(180deg, var(--green-soft, rgba(20, 70, 51, 0.55)), var(--chip) 58%);
  }
  .booking-card.pending {
    border-color: rgba(246, 199, 104, 0.7);
    background: linear-gradient(180deg, var(--amber-soft, rgba(74, 55, 20, 0.5)), var(--chip) 58%);
  }
  .booking-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .state-label {
    font-size: 1.3rem;
    font-weight: 900;
    line-height: 1.2;
  }
  .booking-card.confirmed .state-label { color: var(--green); }
  .booking-card.pending .state-label { color: var(--amber); }
  .booking-title { margin-top: 4px; color: var(--ink); font-weight: 760; }
  .amount {
    white-space: nowrap;
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.16);
    font-weight: 850;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .detail {
    border-top: 1px solid var(--line);
    padding-top: 10px;
    min-width: 0;
  }
  .detail-label { color: var(--muted); font-size: 0.82rem; }
  .detail-value { margin-top: 3px; font-weight: 800; overflow-wrap: anywhere; }
  .rank-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 12px 0;
  }
  .rank-chip {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    border-radius: 999px;
    padding: 6px 10px;
    border: 1px solid var(--line-strong);
    background: var(--chip);
    color: var(--ink);
    font-size: 0.9rem;
    font-weight: 850;
  }
  .rank-chip.strong { border-color: rgba(61, 214, 140, 0.66); color: var(--green); }
  .rank-chip.waiting { border-color: rgba(246, 199, 104, 0.55); color: var(--amber); }
  .copy-box {
    margin-top: 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 12px;
    background: var(--chip);
  }
  .copy-text { margin: 0 0 10px; color: var(--ink); font-size: 0.93rem; }
  .operator-footer { max-width: 980px; margin: 26px auto 0; text-align: right; }
  .operator-footer a { color: var(--muted); font-size: 0.82rem; opacity: 0.62; text-decoration: none; }
  .operator-footer a:hover, .operator-footer a:focus { opacity: 0.9; text-decoration: underline; }
  @media (max-width: 760px) {
    body { padding: 22px 10px 52px; }
    header, .booking-head { display: block; }
    .top-note { text-align: left; margin-top: 10px; }
    .grid, .summary, .status-grid, .detail-grid { grid-template-columns: 1fr; }
    .panel { padding: 16px; }
    h1 { font-size: 1.45rem; }
    .amount { display: inline-block; margin-top: 10px; }
  }
</style>
<link data-arsen-theme="active" rel="stylesheet" href="assets/arsen-theme.css">
<script src="assets/theme-loader.js?v=button-state-colors-v3"></script>
</head>
<body>
<main>
  <header>
    <div>
      <h1>ARSEN 강의 신청·예약 확인</h1>
      <p class="subtitle">승인 코드로 본인 확인 후 강의 신청 상태와 예약 순서를 확인합니다.</p>
    </div>
    <div class="top-note">신청 상태와 예약 순서를 확인하고<br>필요한 안내 문구를 복사할 수 있습니다.<br><a href="/frontend/member.html">회원페이지로 보기</a></div>
  </header>

  <section class="panel compact" aria-label="승인 코드 확인">
    <div id="status" class="notice">신청할 때 입력한 전화번호와 발급받은 승인 코드를 입력하세요.</div>
    <form id="verify-form">
      <div class="grid">
        <div class="field">
          <label for="phone">전화번호</label>
          <input id="phone" name="phone" type="text" inputmode="tel" autocomplete="tel" placeholder="010-1234-5678" required>
          <div class="hint">하이픈 없이 입력해도 됩니다.</div>
        </div>
        <div class="field">
          <label for="code">승인 코드</label>
          <input id="code" name="code" type="text" autocomplete="one-time-code" placeholder="발급받은 승인 코드" required>
        </div>
      </div>
      <button id="verify-btn" type="submit">코드 확인</button>
    </form>
  </section>

  <section id="member-panel" class="panel hidden" aria-label="내 예약 상태">
    <div class="status-grid">
      <div>
        <h2>내 강의 신청·예약 상태</h2>
        <div id="booking-history" class="list"></div>
      </div>
      <aside class="summary" aria-label="신청자 정보">
        <div class="metric">
          <div class="metric-label">신청자</div>
          <div class="metric-value" id="member-name">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">신청 상태</div>
          <div class="metric-value" id="member-status">-</div>
        </div>
        <div class="metric">
          <div class="metric-label">코드 상태</div>
          <div class="metric-value" id="member-expiry">-</div>
        </div>
      </aside>
    </div>
  </section>

  <section id="booking-panel" class="panel hidden" aria-label="강의 예약 신청">
    <h2>강의 예약 신청</h2>
    <form id="booking-form">
      <div class="field">
        <label for="session">일정 선택</label>
        <select id="session" required></select>
        <div class="hint" id="session-hint">공개된 일정을 불러오는 중입니다.</div>
      </div>
      <div class="field">
        <label for="desired_outcome">이번 모임에서 얻고 싶은 것</label>
        <textarea id="desired_outcome" placeholder="예: 업무 자동화 방향 잡기, AI 도구 세팅, 블로그 자동화"></textarea>
      </div>
      <div class="field">
        <label for="preparedness">준비 상태</label>
        <textarea id="preparedness" placeholder="예: 노트북 지참 가능, ChatGPT 유료 구독 사용 중"></textarea>
      </div>
      <button id="booking-btn" type="submit">예약 신청</button>
    </form>
  </section>
</main>
<footer class="operator-footer" aria-label="운영자 전용 링크">
  <a href="/frontend/admin.html" rel="nofollow">운영자 관리</a>
</footer>

<script>
const state = {
  member: null,
  code: "",
  sessions: [],
  bookings: [],
};

const $ = (id) => document.getElementById(id);

function setStatus(message, tone = "") {
  const el = $("status");
  el.textContent = message;
  el.className = `notice ${tone}`.trim();
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
}

function formatAmount(value) {
  const amount = Number(value || 0);
  return amount ? `${amount.toLocaleString()}원` : "-";
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[ch]));
}

function publicState(booking) {
  const confirmed = booking.status === "confirmed" && booking.payment_status === "paid";
  return confirmed ? "예약 확정됨" : "입금 확인 전";
}

function cancelCopy(booking) {
  const session = booking.session_title || "일정 미선택 예약";
  const starts = formatDate(booking.session_starts_at);
  return `운영자님, ${state.member?.name || "신청자"}입니다. ${starts} / ${session} 예약 취소를 요청드립니다. 예약 ID: ${booking.id}`;
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json", ...(options.headers || {}) },
    ...options,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok || data.ok === false) {
    const detail = typeof data.detail === "string" ? data.detail : data.message;
    throw new Error(detail || `HTTP ${response.status}`);
  }
  return data;
}

async function copyCancelText(bookingId) {
  const booking = state.bookings.find((item) => item.id === bookingId);
  if (!booking) return;
  const text = cancelCopy(booking);
  try {
    await navigator.clipboard.writeText(text);
    setStatus("취소 요청 문구를 복사했습니다. 운영자에게 직접 전달해주세요.", "ok");
  } catch (_) {
    window.prompt("문구를 선택해서 직접 복사하세요.", text);
    setStatus("자동 복사에 실패했습니다. 위 창에서 직접 복사해주세요.", "error");
  }
}

function renderBookingCard(booking) {
  const confirmed = booking.status === "confirmed" && booking.payment_status === "paid";
  const requestRank = booking.request_rank ? `신청 순번 ${booking.request_rank}번째` : "신청 순번 계산 전";
  const paidRank = booking.paid_rank ? `입금확정 순번 ${booking.paid_rank}번째` : "입금확정 순번 확인 전";
  const amount = booking.payment_amount_krw || booking.session_price_krw;
  const canPay = !confirmed && Number(amount || 0) > 0 && booking.payment_status !== "waived";
  return `
    <article class="booking-card ${confirmed ? "confirmed" : "pending"}">
      <div class="booking-head">
        <div>
          <div class="state-label">${escapeHtml(publicState(booking))}</div>
          <div class="booking-title">${escapeHtml(booking.session_title || "일정 미선택 예약")}</div>
        </div>
        <div class="amount">${escapeHtml(formatAmount(amount))}</div>
      </div>
      <div class="rank-row">
        <span class="rank-chip">${escapeHtml(requestRank)}</span>
        <span class="rank-chip ${confirmed ? "strong" : "waiting"}">${escapeHtml(paidRank)}</span>
      </div>
      <div class="detail-grid">
        <div class="detail">
          <div class="detail-label">일정</div>
          <div class="detail-value">${escapeHtml(formatDate(booking.session_starts_at))}</div>
        </div>
        <div class="detail">
          <div class="detail-label">장소</div>
          <div class="detail-value">${escapeHtml(booking.session_location || "-")}</div>
        </div>
        <div class="detail">
          <div class="detail-label">금액</div>
          <div class="detail-value">${escapeHtml(formatAmount(amount))}</div>
        </div>
        <div class="detail">
          <div class="detail-label">신청 시각</div>
          <div class="detail-value">${escapeHtml(formatDate(booking.created_at))}</div>
        </div>
        <div class="detail">
          <div class="detail-label">확정 시각</div>
          <div class="detail-value">${escapeHtml(formatDate(booking.confirmed_at))}</div>
        </div>
        <div class="detail">
          <div class="detail-label">처리 방식</div>
          <div class="detail-value">${confirmed ? "입금 확인 완료" : "운영자 입금 확인 대기"}</div>
        </div>
      </div>
      <div class="copy-box">
        <p class="copy-text">예약 취소는 자동 처리되지 않습니다. 아래 버튼은 운영자에게 보낼 취소 요청 문구만 복사합니다.</p>
        <button class="secondary" type="button" data-cancel-copy="${escapeHtml(booking.id)}">운영자에게 취소 요청 문구 복사</button>
      </div>
      ${canPay ? `<div class="copy-box">
        <p class="copy-text">온라인 결제가 설정되어 있으면 카드 결제로 이어집니다. 설정 전에는 승인 코드 확인 후 입금 안내만 표시됩니다.</p>
        <button type="button" data-payment-intent="${escapeHtml(booking.id)}">결제 진행</button>
      </div>` : ""}
    </article>
  `;
}

function renderMember() {
  const member = state.member;
  $("member-panel").classList.remove("hidden");
  $("booking-panel").classList.remove("hidden");
  $("member-name").textContent = member.name || "-";
  $("member-status").textContent = member.status === "approved" ? "승인" : member.status || "-";
  $("member-expiry").textContent = member.code_expiry_label || "기한 없음";

  const list = $("booking-history");
  if (!state.bookings.length) {
    list.innerHTML = '<div class="empty-state"><h3>아직 예약 신청이 없습니다.</h3><p>아래 새 예약 신청에서 일정을 선택하면 이 영역에 신청 순서와 입금 확인 상태가 먼저 표시됩니다.</p></div>';
    return;
  }
  list.innerHTML = state.bookings.map(renderBookingCard).join("");
  list.querySelectorAll("[data-cancel-copy]").forEach((button) => {
    button.addEventListener("click", () => copyCancelText(button.dataset.cancelCopy));
  });
  list.querySelectorAll("[data-payment-intent]").forEach((button) => {
    button.addEventListener("click", () => startBookingPayment(button.dataset.paymentIntent, button));
  });
}

function renderSessions() {
  const select = $("session");
  select.innerHTML = "";
  if (!state.sessions.length) {
    select.innerHTML = '<option value="">현재 공개된 일정이 없습니다</option>';
    select.disabled = true;
    $("booking-btn").disabled = true;
    $("session-hint").textContent = "운영자가 새 일정을 공개하면 다시 예약할 수 있습니다.";
    return;
  }
  select.disabled = false;
  $("booking-btn").disabled = false;
  for (const session of state.sessions) {
    const option = document.createElement("option");
    option.value = session.id;
    option.disabled = session.is_request_full || session.status === "full";
    const pending = session.requested_count ?? 0;
    const confirmed = session.confirmed_booking_count ?? session.confirmed_count ?? 0;
    option.textContent = `${formatDate(session.starts_at)} · ${session.location || "-"} · 확정 ${confirmed}/${session.capacity_max || 5}명 · 신청대기 ${pending}명 · ${formatAmount(session.price_krw)}`;
    select.appendChild(option);
  }
  $("session-hint").textContent = "이미 예약한 일정이 있으면 위의 강의 신청·예약 상태를 먼저 확인하세요. 새 신청은 운영자 확인 후 확정됩니다.";
}

async function loadSessions() {
  const data = await api("/sessions");
  state.sessions = (data.data || []).filter((session) => {
    const startsAt = new Date(session?.starts_at || "");
    return Number.isFinite(startsAt.getTime()) && startsAt.getTime() > Date.now();
  });
  renderSessions();
}

function upsertBooking(booking) {
  if (!booking || !booking.id) return;
  state.bookings = [booking, ...state.bookings.filter((item) => item.id !== booking.id)];
}

function manualPaymentMessage(payment) {
  const account = payment?.manual_account;
  if (!account || !account.number) return payment?.message || "입금 안내를 준비 중입니다. 운영자 안내를 기다려주세요.";
  const accountLine = [account.label, account.bank, account.number, account.holder].filter(Boolean).join(" · ");
  return [
    payment.message || "입금 안내",
    `입금 계좌: ${accountLine}`,
    `금액: ${formatAmount(payment.amount_krw)}`,
    `입금자명/참조: ${payment.payment_reference || "운영자 안내"}`,
    "입금 확인 후 자리가 확정됩니다.",
  ].join("\n");
}

async function loadTossPayments() {
  if (window.TossPayments) return;
  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://js.tosspayments.com/v2/standard";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

async function startBookingPayment(bookingId, button) {
  if (!state.member || !state.code) {
    setStatus("먼저 승인 코드를 확인하세요.", "error");
    return;
  }
  button.disabled = true;
  setStatus("결제 정보를 확인하는 중입니다.");
  try {
    const payload = await api(`/member/bookings/${encodeURIComponent(bookingId)}/payment-intent`, {
      method: "POST",
      body: JSON.stringify({ member_id: state.member.id, code: state.code }),
    });
    upsertBooking(payload.booking);
    renderMember();
    if (payload.data?.status === "paid") {
      setStatus("이미 결제가 확인된 예약입니다.", "ok");
      return;
    }
    const payment = payload.payment || {};
    if (payment.mode !== "toss_payments") {
      setStatus(manualPaymentMessage(payment), "ok");
      return;
    }
    setStatus("안전한 결제 창을 여는 중입니다.");
    await loadTossPayments();
    const tossPayments = TossPayments(payment.client_key);
    const checkout = await tossPayments.payment({ customerKey: payload.data.id });
    await checkout.requestPayment({
      method: "CARD",
      amount: payment.amount,
      orderId: payment.toss_order_id,
      orderName: payment.order_name,
      successUrl: payment.success_url,
      failUrl: payment.fail_url,
    });
  } catch (error) {
    setStatus(error.message || "결제 준비에 실패했습니다.", "error");
  } finally {
    button.disabled = false;
  }
}

(async function confirmTossReturn() {
  const params = new URLSearchParams(window.location.search);
  const paymentKey = params.get("paymentKey");
  const tossOrderId = params.get("orderId");
  const amount = params.get("amount");
  const educationOrderId = params.get("education_order_id");
  if (params.get("payment") === "fail") {
    setStatus("결제가 취소되었거나 실패했습니다. 예약은 유지되며 다시 결제할 수 있습니다.", "error");
    return;
  }
  if (!paymentKey || !tossOrderId || !amount || !educationOrderId) return;
  setStatus("결제 확인 중입니다.");
  try {
    const payload = await api(`/member/education-orders/${encodeURIComponent(educationOrderId)}/payments/toss/confirm`, {
      method: "POST",
      body: JSON.stringify({ payment_key: paymentKey, order_id: tossOrderId, amount: Number(amount) }),
    });
    history.replaceState({}, document.title, window.location.pathname);
    setStatus("결제가 확인되어 예약이 확정되었습니다. 승인 코드로 다시 확인하면 최신 상태를 볼 수 있습니다.", "ok");
    if (payload.booking) upsertBooking(payload.booking);
  } catch (error) {
    setStatus(error.message || "결제 확인에 실패했습니다.", "error");
  }
})();

$("verify-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  $("verify-btn").disabled = true;
  setStatus("코드를 확인하는 중입니다.");
  try {
    const code = $("code").value.trim().toUpperCase();
    const data = await api("/member/verify-code", {
      method: "POST",
      body: JSON.stringify({ phone: $("phone").value.trim(), code }),
    });
    state.member = data.data.member;
    state.code = code;
    state.bookings = data.data.bookings || [];
    renderMember();
    await loadSessions();
    setStatus("코드 확인 완료. 내 강의 신청·예약 상태를 먼저 확인하세요.", "ok");
  } catch (error) {
    setStatus(error.message, "error");
  } finally {
    $("verify-btn").disabled = false;
  }
});

$("booking-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!state.member || !state.code) {
    setStatus("먼저 승인 코드를 확인하세요.", "error");
    return;
  }
  $("booking-btn").disabled = true;
  setStatus("예약 신청을 접수하는 중입니다.");
  try {
    const data = await api("/member/bookings", {
      method: "POST",
      body: JSON.stringify({
        member_id: state.member.id,
        code: state.code,
        session_id: $("session").value,
        desired_outcome: $("desired_outcome").value.trim(),
        preparedness: $("preparedness").value.trim(),
      }),
    });
    const booking = data.data;
    state.bookings = [booking, ...state.bookings.filter((item) => item.id !== booking.id)];
    renderMember();
    await loadSessions();
    setStatus(data.message || "예약 신청이 접수되었습니다. 입금 확인 전 상태로 표시됩니다.", "ok");
  } catch (error) {
    setStatus(error.message, "error");
  } finally {
    $("booking-btn").disabled = false;
  }
});
</script>
